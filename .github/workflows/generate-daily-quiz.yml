name: Gerar quiz diário

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generate-daily-quiz
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar perguntas do dia
        run: node scripts/generate-daily-questions.js

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/questions
          if git diff --cached --quiet; then
            echo "Sem alterações a publicar."
          else
            git commit -m "chore: gera perguntas do quiz diário"
            git push
          fi
